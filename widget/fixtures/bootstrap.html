<!doctype html>
<!-- Fixture host #2: a Bootstrap page — the opinionated-component
     environment older corporate sites are. What this page tests: Bootstrap
     styles every button/input it can see with high-specificity component
     classes and global font rules; the shadow boundary must keep all of it
     out, and the widget's fixed positioning must coexist with Bootstrap's
     own fixed navbar. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: Bootstrap host</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar fixed-top navbar-expand bg-dark" data-bs-theme="dark">
    <div class="container"><span class="navbar-brand">Acme Corp</span></div>
  </nav>
  <main class="container" style="padding-top: 90px">
    <h1>Customer Portal</h1>
    <p class="lead">A pretend Bootstrap app. The widget must not inherit these components.</p>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Bootstrap controls for contrast</h5>
        <button class="btn btn-primary">A Bootstrap button</button>
        <input class="form-control mt-2" placeholder="A Bootstrap input">
      </div>
    </div>
  </main>
  <script src="/dist/widget.js" async
          data-key="pk_local_demo_widget_fixture_key0"
          data-api="http://localhost:3000"
          data-title="Acme Support"
          data-accent="#198754"></script>
</body>
</html>
