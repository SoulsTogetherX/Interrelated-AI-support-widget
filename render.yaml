# Render Blueprint — the whole deployment as code.
#
# In the Render dashboard: New → Blueprint → pick this repo. Render reads
# this file, creates the service, and prompts for exactly the env vars marked
# `sync: false` (the Neon connection details — secrets live in Render's
# dashboard, never in this repo).
#
# ONE service, deliberately (see CLAUDE.md and the plan): Render's free tier
# spins services down after 15 min idle and budgets ~750 instance-hours per
# month — enough to keep exactly one service always warm via the keepalive
# workflow. The Next.js dashboard (M3) goes to Vercel, not here.

services:
  - type: web
    name: interrelated-realtime
    runtime: docker
    plan: free
    # Deploys the dev branch while the project is in active build — every
    # push to dev auto-deploys after CI. Flip to `main` once main starts
    # advancing by merges and the demo should track releases instead.
    branch: dev
    # Build context is the REPO ROOT (the image needs shared/); the
    # Dockerfile's final stage (prod) is what Render builds.
    dockerfilePath: ./realtime/Dockerfile
    dockerContext: .
    # Free tier region; pick the Neon project's region to match (AWS
    # us-west-2 / Oregon) so the service↔DB hop stays inside one region.
    region: oregon
    # Render probes this for liveness. DB-free on purpose — see
    # realtime/src/routes/health.ts.
    healthCheckPath: /api/health
    envVars:
      # Render routes external traffic to the port in PORT; the app honors
      # BACKEND_PORT first, then PORT (server.ts). Setting both to the same
      # value makes the routing unambiguous under either convention.
      - key: PORT
        value: "3000"
      - key: BACKEND_PORT
        value: "3000"
      # ── Neon connection — filled in the Render dashboard, never committed.
      # Use the DIRECT host (no "-pooler" suffix): migrations at boot want a
      # plain connection, and a 5-connection pool doesn't need PgBouncer.
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      # Neon requires TLS; certs are public-CA signed, so verification works
      # with Node's bundled CA store.
      - key: POSTGRES_SSL
        value: "true"
      # Ingest worker ON since M3.6, in WAKE-DRIVEN mode: INGEST_POLL_MS=0
      # means no timer at all — one tick at boot (catches jobs stranded by
      # a deploy), then work happens exactly when the dashboard's enqueue
      # wakes the worker through the internal API. Neon sleeps between
      # ingests, which is the point: any repeating poll would hold its
      # compute awake against the ~100 CU-hour monthly budget.
      - key: INGEST_WORKER
        value: "1"
      - key: INGEST_POLL_MS
        value: "0"
      # ── Widget surface (M2.5) ──
      # Session-token HMAC secret — set in the Render dashboard (any 32+
      # char random string) so widget sessions survive deploys; unset would
      # mean ephemeral and every deploy would silently log visitors out.
      - key: WIDGET_TOKEN_SECRET
        sync: false
      # mock until per-org BYO credentials land in M3: production serves
      # context-quoting mock answers, which is honest for a stack that has
      # no tenant keys yet. Flipping the deployed demo to a real provider:
      # set this to "groq"/"gemini" plus the matching *_API_KEY in the
      # dashboard, seed the demo org against Neon
      # (npm run seed-demo -- --corpus fastify --origin <render url>), and
      # set DEMO_PUBLISHABLE_KEY below. Until then /demo serves honest
      # setup instructions rather than a broken widget.
      - key: LLM_PROVIDER
        value: "mock"
      - key: DEMO_PUBLISHABLE_KEY
        sync: false
      # ── Internal API (M3.4) — the dashboard's server-to-server surface ──
      # ALL-OR-NOTHING PAIR, enforced at boot (server.ts): the secret alone
      # would accept tenant keys it cannot encrypt. Leave BOTH empty in the
      # Render dashboard until the Vercel dashboard is deployed, then set:
      #   INTERNAL_API_SECRET   — 32+ char random string, IDENTICAL value in
      #                           the Vercel project's env
      #   CREDENTIAL_MASTER_KEY — 32 bytes base64
      #     node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # While unset the /internal/* routes simply do not exist (404) — the
      # smoke probe checks exactly that posture on an unconfigured stack.
      - key: INTERNAL_API_SECRET
        sync: false
      - key: CREDENTIAL_MASTER_KEY
        sync: false
