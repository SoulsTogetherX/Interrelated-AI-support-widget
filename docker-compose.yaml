# Development stack: hot-reloading realtime service + pgvector Postgres.
#
#   cp .env.example .env    (once)
#   docker compose up --build
#
# Postgres is also published to the host so `npm test` in realtime/ can run
# the DB-gated integration suite against it directly:
#   POSTGRES_PASSWORD=… npm test

services:
  database:
    build: ./database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, not a bind mount: Postgres data files on a Windows
      # bind mount are both slow and permission-fragile.
      #
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: the
      # Postgres 18 image moved the convention up one level (data lives in a
      # version-numbered subdirectory, enabling in-place pg_upgrade --link).
      # Mounting at the old path makes the container refuse to initialize.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
      target: dev
    # init: true gives the container a real PID 1 (tini) so signals reach
    # tsx/node and Ctrl+C actually stops the stack promptly.
    init: true
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_PORT: "3000"
      # The ingest worker is opt-in (see server.ts) because its poll loop
      # would keep Neon's compute awake; against a LOCAL Postgres, polling
      # is free, so both compose stacks run it.
      INGEST_WORKER: "1"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      # Widget surface (M2.5). mock serves grounded answers derived from the
      # retrieved context — the full loop with zero keys. Point LLM_PROVIDER
      # at groq/gemini/ollama (keys in .env) to chat against a real model.
      # An empty WIDGET_TOKEN_SECRET means ephemeral (fine in dev — the
      # widget re-mints after a restart).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Live-edit mounts. node_modules is NOT masked with an anonymous
      # volume because src/, shared/, and providers/ are mounted
      # individually — the image's own node_modules stays untouched.
      - ./realtime/src:/app/realtime/src
      - ./shared:/app/shared
      - ./providers:/app/providers
    depends_on:
      database:
        # Gate on HEALTHY, not on started: the realtime boot path runs
        # migrations immediately, and racing Postgres's init would turn
        # every `up` into a coin flip.
        condition: service_healthy

volumes:
  pgdata:
